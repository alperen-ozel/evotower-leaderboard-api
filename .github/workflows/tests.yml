name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -v

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Build the Docker image
        run: docker build -t leaderboard-api .

      - name: Start the container and check it answers
        run: |
          docker run -d -p 8000:8000 --name api leaderboard-api
          for i in $(seq 1 20); do
            curl -sf http://localhost:8000/ && exit 0
            sleep 1
          done
          docker logs api
          exit 1
